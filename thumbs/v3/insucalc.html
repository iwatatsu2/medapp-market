<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;background:url(bg-insucalc.png) right center/cover;font-family:'Zen Kaku Gothic New',sans-serif}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,22,10,.62) 0%,rgba(40,22,10,.35) 38%,rgba(40,22,10,0) 60%)}
.copy{position:absolute;left:64px;top:72px;color:#fff;width:640px}
.brand{font-family:'Outfit';font-weight:900;font-size:40px;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#7CB8FF}
h1{margin-top:28px;font-weight:900;font-size:58px;line-height:1.25;white-space:nowrap;text-shadow:0 4px 24px rgba(0,0,0,.35)}
h1 em{font-style:normal;color:#FFD66B}
.flow{margin-top:34px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:24px}
.flow b{background:rgba(255,255,255,.94);color:#3B2412;padding:10px 18px;border-radius:999px}
.flow span{opacity:.9}
.foot{position:absolute;left:64px;bottom:44px;color:rgba(255,255,255,.85);font-size:18px;font-weight:700}
/* スマホ */
.phone{position:absolute;left:640px;top:58px;width:300px;height:620px;border-radius:46px;background:#111;padding:12px;transform:rotate(-6deg);box-shadow:30px 40px 60px rgba(40,20,5,.55)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#DAE3F5}
.phone img{width:100%;display:block;margin-top:-118px}
</style></head><body>
<div class="wrap">
  <div class="shade"></div>
  <div class="copy">
    <div class="brand"><i></i>InsuCalc</div>
    <h1>この親子丼、<br><em>何単位</em>打てばいい？</h1>
    <div class="flow"><b>食べるもの</b><span>＋</span><b>いまの血糖</b><span>→</span><b>単位数</b></div>
  </div>
  <div class="foot">1型糖尿病のインスリン量計算 ・ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-insucalc.png" alt=""></div></div>
</div>
</body></html>
