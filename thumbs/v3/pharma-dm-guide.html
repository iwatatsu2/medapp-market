<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;background:#06221E url(bg-pharma.png) center/cover;font-family:'Zen Kaku Gothic New',sans-serif;color:#EAF7F2}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,26,22,.94) 0%,rgba(4,26,22,.75) 42%,rgba(4,26,22,.15) 70%)}
.copy{position:absolute;left:70px;top:78px}
.brand{font-family:'Outfit';font-weight:700;font-size:26px;letter-spacing:.1em;color:#5EE6B8}
h1{margin-top:24px;font-family:'Noto Serif JP';font-weight:900;font-size:58px;line-height:1.35;white-space:nowrap}
.qa{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.qa div{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700}
.qa b{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:#5EE6B8;color:#06221E;font-family:'Outfit'}
.foot{position:absolute;left:70px;bottom:40px;font-size:17px;font-weight:500;opacity:.8}
.phone{position:absolute;left:860px;top:40px;width:300px;height:640px;border-radius:46px;background:#0B0F0E;padding:12px;box-shadow:0 0 0 2px rgba(94,230,184,.35),0 30px 60px rgba(0,0,0,.6)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden}
.phone img{width:100%;display:block}
</style></head><body>
<div class="wrap">
  <div class="fade"></div>
  <div class="copy">
    <div class="brand">PharmaDM Guide</div>
    <h1>糖尿病の薬、<br>手術前はいつ止める？</h1>
    <div class="qa"><div><b>1</b>術前休薬のタイムライン</div><div><b>2</b>シックデイ・食止め時の対応</div><div><b>3</b>質問に答えるとフローで結論</div></div>
  </div>
  <div class="foot">薬剤師のための糖尿病判断ツール ・ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-pharma-dm-guide.png" alt=""></div></div>
</div>
</body></html>
