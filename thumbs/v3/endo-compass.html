<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}

.sub{margin-top:28px;font-size:22px;line-height:1.7;color:#CFC6E6}
.tests{position:absolute;left:64px;bottom:40px;display:flex;flex-wrap:wrap;gap:10px;width:560px}
.tests span{border:1.5px solid rgba(231,196,106,.6);color:#E7C46A;border-radius:999px;padding:6px 16px;font-size:17px}
</style></head><body>
<div class="wrap">
  <svg class="chart" viewBox="0 0 640 520" fill="none" font-family="Cormorant Garamond" font-size="22">

    <text x="520" y="238" fill="#E7C46A" font-size="20" font-family="Zen Kaku Gothic New">判定ライン</text>
    <path d="M70 400 C150 395 190 300 250 210 S360 110 430 150 S560 300 610 340" stroke="#8C7CFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 410 C160 405 230 380 300 352 S470 330 610 360" stroke="#F3EAD7" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  </div>

</div>
