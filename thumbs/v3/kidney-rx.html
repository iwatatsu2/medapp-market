<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;background:#F7EEDB url(bg-kidney.png) right center/cover;font-family:'Zen Kaku Gothic New',sans-serif;color:#2238C9}
.copy{position:absolute;left:60px;top:66px;width:600px}
.brand{font-family:'Outfit';font-weight:800;font-size:30px;letter-spacing:.04em;color:#F0458F}
h1{margin-top:22px;font-family:'Dela Gothic One';font-weight:400;font-size:66px;line-height:1.18;letter-spacing:-.01em;mix-blend-mode:multiply}
h1 mark{background:none;color:#2238C9;position:relative;z-index:0}
h1 mark::before{content:"";position:absolute;left:-6px;right:-6px;bottom:4px;height:34px;background:#FF5FA2;opacity:.75;z-index:-1;transform:skew(-6deg)}
.sub{margin-top:26px;font-weight:900;font-size:26px;line-height:1.6}
.tags{margin-top:22px;display:flex;gap:10px}
.tags span{border:3px solid #2238C9;border-radius:6px;padding:6px 14px;font-weight:900;font-size:20px}
.foot{position:absolute;left:60px;bottom:40px;font-weight:700;font-size:18px;opacity:.8}
.phone{position:absolute;left:660px;top:70px;width:270px;height:580px;border-radius:40px;background:#1D2B8F;padding:10px;transform:rotate(5deg);box-shadow:16px 16px 0 #FF5FA2}
.phone .scr{width:100%;height:100%;border-radius:31px;overflow:hidden}
.phone img{width:100%;display:block}
</style></head><body>
<div class="wrap">
  <div class="copy">
    <div class="brand">KidneyRx</div>
    <h1>腎臓が弱った人の<br><mark>薬の量</mark>、<br>すぐ引ける。</h1>
    <div class="sub">薬の名前を入れるだけ。<br>透析・CKDでの量が一覧で出る。</div>
    <div class="tags"><span>372薬剤</span><span>内服・注射・外用</span></div>
  </div>
  <div class="foot">医師・薬剤師・研修医向け ・ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-kidney-rx.png" alt=""></div></div>
</div>
</body></html>
