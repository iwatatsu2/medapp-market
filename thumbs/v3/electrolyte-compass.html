<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
/* 心電図用紙 */
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Zen Kaku Gothic New',sans-serif;color:#3A1410;
 background-color:#FFF4EE;
 background-image:linear-gradient(rgba(230,90,80,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(230,90,80,.35) 1.5px,transparent 1.5px),linear-gradient(rgba(230,90,80,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(230,90,80,.14) 1px,transparent 1px);
 background-size:50px 50px,50px 50px,10px 10px,10px 10px}
.ecg{position:absolute;left:0;top:300px;width:1280px;height:160px}
.el{position:absolute;font-family:'Archivo Black';font-size:112px;line-height:1;color:#E0473C}
.el small{display:block;font-family:'IBM Plex Mono';font-size:18px;color:#3A1410;margin-top:6px;letter-spacing:.05em}
.na{left:60px;top:58px}.k{left:300px;top:58px}.ca{left:440px;top:58px}.mg{left:680px;top:58px;color:#3A1410}
.copy{position:absolute;left:60px;top:470px}
.brand{font-family:'IBM Plex Mono';font-weight:700;font-size:22px;letter-spacing:.08em;color:#E0473C}
h1{margin-top:8px;font-weight:900;font-size:54px;line-height:1.25}
.foot{position:absolute;left:60px;bottom:28px;font-family:'IBM Plex Mono';font-size:16px;font-weight:600}
.phone{position:absolute;right:86px;top:44px;width:290px;height:630px;border-radius:44px;background:#1A1A1A;padding:11px;transform:rotate(3deg);box-shadow:0 30px 50px rgba(120,30,20,.35)}
.phone .scr{width:100%;height:100%;border-radius:34px;overflow:hidden}
.phone img{width:100%;display:block}
</style></head><body>
<div class="wrap">
  <svg class="ecg" viewBox="0 0 1280 160" fill="none"><path d="M0 90 H120 l14-8 14 8 H200 l10 18 16-96 18 118 12-40 H330 l16-14 22 14 H470 l14-8 14 8 H530 l10 18 16-96 18 118 12-40 H660 l16-14 22 14 H820" stroke="#3A1410" stroke-width="4" stroke-linejoin="round"/></svg>
  <div class="el na">Na<small>135–145</small></div>
  <div class="el k">K<small>3.5–5.0</small></div>
  <div class="el ca">Ca<small>8.5–10.2</small></div>
  <div class="el mg">Mg<small>1.8–2.4</small></div>
  <div class="copy">
    <div class="brand">ELECTROLYTE COMPASS</div>
    <h1>電解質の異常、<br>原因と補正量まで一気に。</h1>
  </div>
  <div class="foot">研修医・救急・病棟 ／ 酸塩基・AG・補正計算 ／ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-electrolyte-compass.png" alt=""></div></div>
</div>
</body></html>
