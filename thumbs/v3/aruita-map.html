<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;background:#F3EAD6 url(bg-aruita.png) center/cover;font-family:'Zen Kaku Gothic New',sans-serif;color:#2C2A26}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(243,234,214,.96) 0%,rgba(243,234,214,.85) 36%,rgba(243,234,214,0) 58%)}
.copy{position:absolute;left:64px;top:70px}
.brand{display:inline-block;background:#D7261E;color:#fff;font-weight:900;font-size:24px;padding:6px 16px;border-radius:6px}
h1{margin-top:26px;font-weight:900;font-size:66px;line-height:1.22;white-space:nowrap}
h1 em{font-style:normal;color:#D7261E;text-decoration:underline;text-decoration-thickness:8px;text-underline-offset:10px}
.stats{margin-top:34px;display:flex;gap:14px}
.stats div{background:#2C2A26;color:#F3EAD6;border-radius:10px;padding:12px 18px;font-family:'DotGothic16';font-size:30px;line-height:1}
.stats small{display:block;font-family:'Zen Kaku Gothic New';font-size:14px;font-weight:700;opacity:.75;margin-bottom:6px}
.foot{position:absolute;left:64px;bottom:40px;font-weight:700;font-size:18px}
.phone{position:absolute;left:820px;top:40px;width:300px;height:640px;border-radius:46px;background:#2C2A26;padding:12px;transform:rotate(5deg);box-shadow:20px 30px 50px rgba(60,40,10,.4)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden}
.phone img{width:100%;display:block}
.phone .scr{position:relative}
.route{position:absolute;left:0;top:0;width:100%;height:100%}
</style></head><body>
<div class="wrap">
  <div class="fade"></div>
  <div class="copy">
    <span class="brand">歩いたマップ</span>
    <h1>歩いた道が、<br>地図に<em>赤い線</em>で残る。</h1>
    <div class="stats"><div><small>きょうの距離</small>4.2km</div><div><small>歩数</small>5,830</div><div><small>カロリー</small>182</div></div>
  </div>
  <div class="foot">散歩の記録 ・ その日の道のりを画像でシェア ・ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-aruita-map.png" alt=""><svg class="route" viewBox="0 0 276 616" fill="none"><path d="M120 470 L120 420 L80 400 L80 330 L150 315 L150 250 L205 240 L215 180 L170 165" stroke="#E0241B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="470" r="9" fill="#fff" stroke="#E0241B" stroke-width="5"/><circle cx="170" cy="165" r="8" fill="#E0241B"/></svg></div></div>
</div>
</body></html>
