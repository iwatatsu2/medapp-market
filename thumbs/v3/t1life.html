<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@700;900&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
/* コルクボード */
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Zen Maru Gothic',sans-serif;color:#2B2118;
 background:#C9A57A radial-gradient(rgba(90,60,30,.22) 1.2px,transparent 1.6px) 0 0/9px 9px}
.note{position:absolute;width:250px;padding:26px 22px 22px;font-family:'Klee One';font-size:25px;line-height:1.5;box-shadow:4px 10px 18px rgba(60,35,10,.3)}
.note::before{content:"";position:absolute;left:50%;top:-10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c62828);box-shadow:0 3px 4px rgba(0,0,0,.35)}
.note small{display:block;font-family:'Zen Maru Gothic';font-size:15px;font-weight:900;opacity:.6;margin-bottom:6px}
.n1{left:40px;top:250px;background:#FFF59D;transform:rotate(-4deg)}
.n2{left:300px;top:300px;background:#B3E5FC;transform:rotate(3deg)}
.n3{left:60px;top:500px;background:#F8BBD0;transform:rotate(2deg);width:270px}
.n4{left:350px;top:530px;background:#C8E6C9;transform:rotate(-3deg)}
.head{position:absolute;left:40px;top:44px;background:#FFFDF6;padding:22px 30px 24px;transform:rotate(-1deg);box-shadow:4px 10px 18px rgba(60,35,10,.3)}
.head b{font-family:'Outfit';font-size:30px;color:#2B6BE8}
.head h1{font-weight:900;font-size:46px;line-height:1.25;margin-top:4px}
.phone{position:absolute;left:780px;top:40px;width:300px;height:640px;border-radius:46px;background:#1B1B1B;padding:12px;transform:rotate(4deg);box-shadow:20px 30px 40px rgba(60,35,10,.45)}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden}
.phone img{width:100%;display:block}
.foot{position:absolute;right:30px;bottom:18px;font-size:16px;font-weight:900;color:#3E2A16;background:rgba(255,253,246,.8);padding:6px 14px;border-radius:8px}
</style></head><body>
<div class="wrap">
  <div class="head"><b>T1Life</b><h1>1型の「みんなどうしてる？」<br>が集まる場所。</h1></div>
  <div class="note n1"><small>食事</small>給食の前って<br>何単位にしてる？</div>
  <div class="note n2"><small>低血糖</small>部活中の補食、<br>なに持ってく？</div>
  <div class="note n3"><small>CGM</small>センサー、お風呂で<br>はがれない工夫</div>
  <div class="note n4"><small>ライフ</small>修学旅行の<br>準備リスト</div>
  <div class="phone"><div class="scr" style="position:relative"><img src="shot-t1life.png" alt=""><div style="position:absolute;left:14px;right:14px;top:226px;height:96px;background:#FFF59D;transform:rotate(-3deg);box-shadow:3px 8px 14px rgba(60,35,10,.3);font-family:'Klee One';font-size:18px;line-height:1.4;padding:14px 14px;color:#2B2118">CGM・食事・低血糖…<br>8つのテーマで話せる</div></div></div>
  <div class="foot">匿名OK ・ 1型糖尿病コミュニティ ・ 無料</div>
</div>
</body></html>
