<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px}
.wrap{position:relative;width:1280px;height:720px;overflow:hidden;background:linear-gradient(135deg,#FCE4EC 0%,#EDE7F6 55%,#E3F2FD 100%);font-family:'Zen Maru Gothic',sans-serif;color:#2A2140}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.b1{width:420px;height:420px;left:-120px;bottom:-160px;background:#F8BBD0;opacity:.6}
.b2{width:300px;height:300px;right:380px;top:-120px;background:#D1C4E9;opacity:.7}
.copy{position:absolute;left:70px;top:90px}
.brand{font-weight:900;font-size:24px;letter-spacing:.2em;color:#8E5BD6}
h1{margin-top:22px;font-family:'Yusei Magic';font-weight:400;font-size:72px;line-height:1.25}
h1 span{color:#E2558B}
.legend{margin-top:34px;display:flex;gap:12px}
.legend i{font-style:normal;display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;font-weight:900;font-size:32px}
.d{background:#FFF59D;color:#E0A100}.j{background:#FFD6DC;color:#E5395B}.s{background:#DCE3FF;color:#6A72E8}.y{background:#EFEFF3;color:#A0A0B0}
.sub{margin-top:26px;font-weight:700;font-size:22px;line-height:1.6;color:#5B5070}
.phone{position:absolute;left:800px;top:34px;width:310px;height:650px;border-radius:48px;background:#1D2235;padding:12px;transform:rotate(-4deg);box-shadow:0 30px 50px rgba(80,50,120,.3)}
.phone .scr{width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff}
.phone img{width:100%;display:block}
.foot{position:absolute;left:70px;bottom:36px;font-weight:700;font-size:17px;color:#7A6E90}
</style></head><body>
<div class="wrap">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="copy">
    <div class="brand">NURSE SHIFT</div>
    <h1>シフト表、<br><span>タップだけ</span>で<br>1か月ぶん。</h1>
    <div class="legend"><i class="d">日</i><i class="j">準</i><i class="s">深</i><i class="y">休</i></div>
    <div class="sub">仲間と共有して、休みが重なる日もひと目で。</div>
  </div>
  <div class="foot">看護師さんのシフト管理 ・ 無料</div>
  <div class="phone"><div class="scr"><img src="shot-nurse-shift.png" alt=""></div></div>
</div>
</body></html>
