<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="slide-template.css">
<style>
  .cta { text-align:center; }
  .cta-title { font-size:36px; font-weight:900; color:white; margin-bottom:12px; }
  .cta-app { display:inline-block; background:linear-gradient(135deg,#14b8a6,#0d9488); color:white; font-size:26px; font-weight:900; padding:14px 36px; border-radius:14px; margin:10px 0; }
  .cta-url { font-size:20px; color:#5eead4; margin-top:6px; }

  .qr-area { display:flex; justify-content:center; gap:60px; margin-top:24px; }
  .qr-card { text-align:center; }
  .qr-card img { width:150px; height:150px; border-radius:10px; }
  .qr-label { font-size:18px; font-weight:700; margin-top:8px; }
  .qr-sublabel { font-size:13px; color:#94a3b8; margin-top:2px; }

  .other-apps { margin-top:24px; }
  .other-apps-title { font-size:20px; font-weight:900; color:#94a3b8; margin-bottom:12px; }
  .app-list { display:flex; justify-content:center; gap:20px; }
  .app-item { background:rgba(20,184,166,0.08); border:1px solid rgba(20,184,166,0.2); border-radius:12px; padding:14px 20px; text-align:center; min-width:180px; }
  .app-item-name { font-size:18px; font-weight:900; color:#2dd4bf; }
  .app-item-desc { font-size:13px; color:#94a3b8; margin-top:4px; }
</style></head><body>
<div class="slide slide-dark cta">
  <div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
  <div class="content">
    <div style="margin-top:12px">
      <div style="font-size:18px;color:#94a3b8;margin-bottom:6px">病棟で困ったらポケットから</div>
      <div class="cta-title">今日から <span class="accent">DM Compass</span> を使おう</div>
      <div class="cta-app">📱 ホーム画面に追加するだけ</div>
      <div class="cta-url">アプリストア不要 ／ 無料 ／ 登録不要</div>

      <div class="qr-area">
        <div class="qr-card">
          <img src="../qr/qr-medapp.png" alt="MedApp Market">
          <div class="qr-label" style="color:#f59e0b">🏥 MedApp Market</div>
          <div class="qr-sublabel">DM Compass含む全アプリはこちら</div>
        </div>
      </div>

      <div class="other-apps">
        <div class="other-apps-title">▼ MedApp Market で他のアプリもチェック</div>
        <div class="app-list">
          <div class="app-item">
            <div class="app-item-name">InsuCalc</div>
            <div class="app-item-desc">インスリン量計算</div>
          </div>
          <div class="app-item">
            <div class="app-item-name">Electrolyte Compass</div>
            <div class="app-item-desc">電解質補正計算</div>
          </div>
          <div class="app-item">
            <div class="app-item-name">Endo Compass</div>
            <div class="app-item-desc">内分泌負荷試験ガイド</div>
          </div>
        </div>
      </div>

      <div style="margin-top:16px;font-size:16px;color:#64748b">制作: <span style="color:#14b8a6;font-weight:900">Dr. いわたつ</span>（糖尿病・内分泌専門医）</div>
    </div>
  </div>
</div>
</body></html>
