<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="slide-template.css">
<style>
  .app-badge { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#14b8a6,#0d9488); color:white; font-size:32px; font-weight:900; padding:14px 32px; border-radius:14px; margin-bottom:16px; }
  .feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  .feat-card { background:rgba(20,184,166,0.08); border:1px solid rgba(20,184,166,0.25); border-radius:12px; padding:20px; }
  .feat-icon { font-size:32px; margin-bottom:6px; }
  .feat-name { font-size:22px; font-weight:900; color:#2dd4bf; }
  .feat-desc { font-size:17px; color:#94a3b8; margin-top:4px; line-height:1.5; }
</style></head><body>
<div class="slide slide-dark">
  <div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
  <div class="content">
    <div class="slide-header"><div class="slide-num">02</div><div class="slide-logo">DM Compass</div></div>
    <div class="app-badge">📱 DM Compass</div>
    <h2 class="section-title" style="font-size:34px">糖尿病病棟管理の<span class="accent">判断支援アプリ</span></h2>
    <p style="font-size:20px;color:#94a3b8;margin-top:6px">無料・登録不要・スマホ対応のWebアプリ</p>

    <div class="feature-grid">
      <div class="feat-card">
        <div class="feat-icon">🔢</div>
        <div class="feat-name">CALC：5つの計算ツール</div>
        <div class="feat-desc">必要エネルギー・腎症ステージ・末梢混注・IVH混注・SS作成</div>
      </div>
      <div class="feat-card">
        <div class="feat-icon">📖</div>
        <div class="feat-name">GUIDE：医学情報ガイド</div>
        <div class="feat-desc">インスリン製剤・経口薬・糖尿病分類・合併症</div>
      </div>
      <div class="feat-card">
        <div class="feat-icon">⚡</div>
        <div class="feat-name">10秒で結果表示</div>
        <div class="feat-desc">数値入力するだけ。計算ロジックはガイドライン準拠</div>
      </div>
      <div class="feat-card">
        <div class="feat-icon">🏥</div>
        <div class="feat-name">病棟で即使える</div>
        <div class="feat-desc">スマホ最適化・オフライン対応・PWA</div>
      </div>
    </div>
    <div class="slide-footer"><span>© Dr. いわたつ</span><span>DM Compass シリーズ vol.4</span></div>
  </div>
</div>
</body></html>
