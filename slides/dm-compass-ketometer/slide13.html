<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link rel="stylesheet" href="slide-template.css">
<style>
  .cta { text-align:center; }
  .cta-title { font-size:38px; font-weight:900; color:white; margin-bottom:10px; }
  .cta-app { display:inline-block; background:linear-gradient(135deg,#14b8a6,#0d9488); color:white; font-size:28px; font-weight:900; padding:12px 36px; border-radius:14px; margin:10px 0; }
  .cta-url { font-size:21px; color:#5eead4; margin-top:6px; }
  .link-area { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
  .link-card { background:rgba(20,184,166,0.1); border:1px solid rgba(20,184,166,0.25); border-radius:12px; padding:14px 24px; text-align:center; min-width:200px; }
  .link-icon { font-size:28px; margin-bottom:4px; }
  .link-label { font-size:18px; font-weight:700; color:#2dd4bf; }
  .link-url { font-size:16px; color:#94a3b8; margin-top:4px; word-break:break-all; }
  .cta-features { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:18px; text-align:center; }
  .cta-feat { background:rgba(20,184,166,0.08); border:1px solid rgba(20,184,166,0.15); border-radius:10px; padding:8px; }
  .cta-feat-name { font-size:16px; font-weight:700; color:#2dd4bf; }
  .cta-feat-desc { font-size:14px; color:#94a3b8; margin-top:2px; }
</style></head><body>
<div class="slide slide-dark cta">
  <div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
  <div class="content">
    <div style="margin-top:12px">
      <div style="font-size:19px;color:#94a3b8;margin-bottom:6px">この内容をいつでもポケットに</div>
      <div class="cta-title">病棟で困ったら <span class="accent">DM Compass</span> を開こう</div>
      <div class="cta-app">📱 DM Compass</div>
      <div class="cta-url">🔗 無料・登録不要・スマホ対応</div>
      <div class="link-area">
        <div class="link-card">
          <div class="link-icon">🌐</div>
          <div class="link-label">公式サイト</div>
          <div class="link-url">driwatatsu.readdy.co</div>
        </div>
        <div class="link-card">
          <div class="link-icon">📱</div>
          <div class="link-label">Instagram</div>
          <div class="link-url">@dr.iwatatsu</div>
        </div>
        <div class="link-card">
          <div class="link-icon">🏥</div>
          <div class="link-label">医療アプリまとめ</div>
          <div class="link-url">medapp-market.vercel.app</div>
        </div>
      </div>
      <div class="cta-features">
        <div class="cta-feat"><div class="cta-feat-name">高血糖緊急症</div><div class="cta-feat-desc">DKA/HHS判定</div></div>
        <div class="cta-feat"><div class="cta-feat-name">インスリン計算</div><div class="cta-feat-desc">TDD自動算出</div></div>
        <div class="cta-feat"><div class="cta-feat-name">SS作成</div><div class="cta-feat-desc">スライディングスケール</div></div>
      </div>
      <div style="margin-top:12px;font-size:18px;color:#64748b">制作: <span style="color:#14b8a6;font-weight:900">Dr. いわたつ</span>（糖尿病専門医・指導医 / 内分泌専門医 / 医学博士）</div>
    </div>
  </div>
</div>
</body></html>
