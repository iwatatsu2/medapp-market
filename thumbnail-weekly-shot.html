<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeeklyShot サムネイル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .container {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .left {
    width: 780px;
    padding: 28px 50px 50px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    z-index: 2;
  }

  .badges {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-block;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    color: white;
  }

  .badge-primary {
    background: linear-gradient(135deg, #22c55e, #16a34a);
  }

  .badge-secondary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
  }

  .badge-free {
    background: #22c55e;
  }

  .title {
    font-size: 72px;
    font-weight: 900;
    color: white;
    line-height: 1.1;
    letter-spacing: -1px;
  }

  .title .accent {
    background: linear-gradient(135deg, #22c55e, #4ade80);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 32px;
    color: white;
    margin-top: 16px;
    font-weight: 700;
    line-height: 1.5;
  }

  .features {
    margin-top: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 32px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    font-size: 22px;
    font-weight: 500;
  }

  .feature-icon {
    font-size: 22px;
    flex-shrink: 0;
  }

  .author {
    margin-top: 28px;
  }

  .author-name {
    color: #4ade80;
    font-size: 22px;
    font-weight: 900;
  }

  .author-role {
    color: #94a3b8;
    font-size: 16px;
    margin-top: 2px;
  }

  .right {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    width: 420px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-mockup {
    width: 320px;
    background: white;
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .phone-header {
    text-align: center;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 12px;
  }

  .phone-title {
    font-size: 18px;
    font-weight: 900;
    color: #16a34a;
  }

  .schedule-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 700;
  }

  .schedule-done {
    background: #f0fdf4;
    color: #16a34a;
  }

  .schedule-next {
    background: #fef3c7;
    color: #d97706;
  }

  .schedule-future {
    background: #f1f5f9;
    color: #64748b;
  }

  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    z-index: 1;
  }

  .bg-glow-1 {
    background: #22c55e;
    width: 500px; height: 500px;
    top: -150px; right: 150px;
    opacity: 0.12;
  }

  .bg-glow-2 {
    background: #16a34a;
    width: 500px; height: 500px;
    bottom: -200px; left: 100px;
    opacity: 0.10;
  }
</style>
</head>
<body>
<div class="container">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="left">
    <div class="badges">
      <span class="badge badge-primary">糖尿病・肥満症</span>
      <span class="badge badge-secondary">LINE連携</span>
      <span class="badge badge-free">無料</span>
    </div>

    <h1 class="title"><span class="accent">Weekly</span>Shot</h1>
    <p class="subtitle">週1回のGLP-1注射、<br>もう打ち忘れない。</p>

    <div class="features">
      <div class="feature-item"><span class="feature-icon">💬</span>LINEで自動リマインド</div>
      <div class="feature-item"><span class="feature-icon">📅</span>週1回注射スケジュール管理</div>
      <div class="feature-item"><span class="feature-icon">⚡</span>登録30秒・アプリ不要</div>
      <div class="feature-item"><span class="feature-icon">💊</span>全対応製剤に対応</div>
      <div class="feature-item"><span class="feature-icon">📱</span>専門医が設計・運営</div>
    </div>

    <div class="author">
      <div class="author-name">Dr. いわたつ</div>
      <div class="author-role">糖尿病・肥満症専門医</div>
    </div>
  </div>

  <div class="right">
    <div class="phone-mockup">
      <div class="phone-header">
        <div class="phone-title">WeeklyShot</div>
      </div>
      <div class="schedule-item schedule-done">
        <span>5/16（金）</span><span>✅ 済</span>
      </div>
      <div class="schedule-item schedule-next">
        <span>5/23（金）</span><span>⏰ 今日</span>
      </div>
      <div class="schedule-item schedule-future">
        <span>5/30（金）</span><span>予定</span>
      </div>
      <div class="schedule-item schedule-future">
        <span>6/6（金）</span><span>予定</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
