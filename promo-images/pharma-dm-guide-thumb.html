<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; }
  .card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(160deg, #0f1923 0%, #0a1a1a 50%, #0d2222 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    padding: 0 60px;
    gap: 40px;
  }
  .card::after {
    content: '';
    position: absolute;
    top: -50px;
    right: 150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(20,184,166,0.10) 0%, transparent 65%);
    border-radius: 50%;
  }
  .left {
    flex: 1;
    position: relative;
    z-index: 1;
  }
  .app-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .badges {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .badge {
    background: rgba(20,184,166,0.12);
    border: 1px solid rgba(20,184,166,0.25);
    border-radius: 6px;
    padding: 4px 12px;
    color: #14b8a6;
    font-size: 13px;
    font-weight: 700;
  }
  .badge-free {
    background: #14b8a6;
    color: #0a1a1a;
    border: none;
    font-weight: 800;
  }
  .title {
    font-size: 46px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .catchcopy {
    font-size: 18px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 26px;
    line-height: 1.5;
  }
  .features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    font-weight: 600;
  }
  .feature .icon { font-size: 13px; flex-shrink: 0; width: 18px; text-align: center; }
  .right {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    align-self: flex-end;
  }
  .phone {
    width: 320px;
    height: 580px;
    background: #000;
    border-radius: 40px;
    border: 5px solid rgba(255,255,255,0.15);
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 50px rgba(20,184,166,0.10);
    position: relative;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 2;
  }
  .phone img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top;
    background: #0a1a1a;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="app-icon">
      <img src="file:///Users/iwamototatsuya/Desktop/Claude-Projects/pharma-dm-guide/public/app-icon.png" alt="">
    </div>
    <div class="badges">
      <span class="badge">糖尿病薬</span>
      <span class="badge">薬剤師向け</span>
      <span class="badge badge-free">無料</span>
    </div>
    <div class="title">PharmaDM Guide</div>
    <div class="catchcopy">
      病棟で迷ったら、ここで確認。<br>
      糖尿病薬の判断フローチャート
    </div>
    <div class="features">
      <div class="feature"><span class="icon">💊</span> 術前休薬ガイド</div>
      <div class="feature"><span class="icon">🤒</span> シックデイ対応</div>
      <div class="feature"><span class="icon">🚫</span> 食止め時の対応</div>
      <div class="feature"><span class="icon">⚕️</span> 周術期の血糖管理</div>
      <div class="feature"><span class="icon">🫘</span> 腎機能別 用量調整</div>
      <div class="feature"><span class="icon">💉</span> 注射製剤の取り扱い</div>
      <div class="feature"><span class="icon">⚡</span> 薬物相互作用</div>
      <div class="feature"><span class="icon">👴</span> 高齢者の薬剤選択</div>
    </div>
  </div>
  <div class="right">
    <div class="phone">
      <img src="file:///Users/iwamototatsuya/Desktop/スクリーンショット 2026-06-01 16.57.43.png" alt="">
    </div>
  </div>
</div>
</body>
</html>
